#Minecraft server properties
#Generated configuration

# Server name
server-name=Minecraft Server

# Server port
server-port=25565

# Maximum number of players
max-players=20

# Difficulty level: peaceful(0), easy(1), normal(2), hard(3)
difficulty=2

# Game mode: survival, creative, adventure, spectator
gamemode=survival

# PvP enabled
pvp=true

# Spawn protection
spawn-protection=16

# View distance (chunks)
view-distance=10

# Simulation distance
simulation-distance=10

# Enable command blocks
enable-command-blocks=false

# MOTD (Message of the Day)
motd=\u00a76Welcome to the Minecraft Server!

# Allow flight
allow-flight=false

# Allow Nether
allow-nether=true

# Announce player achievements
announce-player-achievements=true

# Enable query
enable-query=false

# Enable remote console (RCON)
enable-rcon=false

# Force game mode
force-gamemode=false

# Hardcore mode
hardcore=false

# Level name
level-name=world

# Level seed (leave empty for random)
level-seed=

# Level type
level-type=default

# Online mode (requires valid Minecraft account)
online-mode=true

# Prevent proxy connections
prevent-proxy-connections=false

# Hide online players from server list ping
hide-online-players=false

# Synchronous chunk unloading
sync-chunk-writes=true

# Enable whitelist
white-list=false
