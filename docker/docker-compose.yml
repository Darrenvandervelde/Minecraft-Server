version: '3.8'

services:
  minecraft-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: minecraft-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      MEMORY: "1024M"
    volumes:
      - ./server:/minecraft/server
      - ./world:/minecraft/world
      - ./plugins:/minecraft/plugins
      - ./backups:/minecraft/backups
    restart: unless-stopped
    networks:
      - minecraft-network

networks:
  minecraft-network:
    driver: bridge
